---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fgw-dubbo-client
data:
  dubbo-client.js: |
    var TARGET = 'localhost:6666'
    var DURATION = 10
    var RATE = 50000
    var CONCURRENCY = 8

    function test({ target, duration, rate, concurrency }) {
      var sessionIndex = 0
      var requestCount = 0
      var requestLatency = 0

      var $time

      var send = pipeline($=>$
        .onStart(req => req)
        .handleMessageStart(() => {
          $time = pipy.performance.now()
        })
        .muxQueue(() => (sessionIndex++ % concurrency)).to($=>$
          .encodeDubbo()
          .connect(target)
          .decodeDubbo()
        )
        .replaceMessage(() => {
          requestLatency += pipy.performance.now() - $time
          requestCount++
          return new StreamEnd
        })
      )

      var msg = new Message({}, Hessian.encode([
        '2.0.2',
        'org.apache.dubbo.sample.UserProvider',
        'v1',
        'getUser',
        'I',
      ]))

      var startTime = 0
      var done = false

      function fire() {
        if (!startTime) startTime = Date.now()
        new Timeout(1 / rate).wait().then(() => {
          send.spawn(msg)
          if (!done) fire()
        })
      }

      fire()

      return new Timeout(duration).wait().then(() => {
        var totalTime = (Date.now() - startTime) / 1000
        done = true
        return {
          totalTime,
          requestCount,
          requestLatency,
        }
      })
    }

    pipy.listen(8080, $=>$
      .serveHTTP(req => {
        var q = new URL(req.head.path).searchParams
        return test({
          target: q.get('target') || TARGET,
          duration: Number.parseInt(q.get('duration') || DURATION),
          rate: Number.parseInt(q.get('rate') || RATE),
          concurrency: Number.parseInt(q.get('concurrency') || CONCURRENCY),
        }).then(r => new Message([
          `Total requests: ${r.requestCount} in ${r.totalTime}s`,
          `Request rate: ${r.requestCount / r.totalTime}req/s`,
          `Avg. latency: ${r.requestLatency / r.requestCount}ms`,
          ''
        ].join('\n')))
      })
    )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgw-dubbo-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgw-dubbo-client
      version: v1
  template:
    metadata:
      labels:
        app: fgw-dubbo-client
        version: v1
    spec:
      containers:
        - name: client
          image: cybwan/fgw-dubbo-demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          command: ['pipy']
          args: [
            "demo/dubbo-client.js",
            "--threads=max",
            "--reuse-port",
          ]
          #resources:
          #  requests:
          #    cpu: "1"
          #    memory: "1Gi"
          #  limits:
          #    cpu: "1"
          #    memory: "1Gi"
          volumeMounts:
            - mountPath: /demo
              name: client
      volumes:
        - name: client
          configMap:
            name: fgw-dubbo-client
            items:
              - key: "dubbo-client.js"
                path: "dubbo-client.js"