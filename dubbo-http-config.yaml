resources:
- kind: Gateway
  metadata:
    name: test
  spec:
    listeners:
      - name: test
        port: 8001
        protocol: HTTP

- kind: HTTPRoute
  spec:
    parentRefs:
      - kind: Gateway
        name: test
        sectionName: test
    hostnames:
      - test.com
    rules:
      - matches:
          - path:
              type: Exact
              value: /hostname
        filters:
          - type: TranscodeDubbo
            transcodeDubbo:
              service: io.flomesh.demo.api.HttpbinService
              version: v1
              method: hostname
              signature: I
        backendRefs:
          - kind: Backend
            name: test-dubbo-svc

- kind: Backend
  metadata:
    name: test-dubbo-svc
  spec:
    targets:
      - address: 10.0.0.2
        port: 6666
