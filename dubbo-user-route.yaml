resources:
  - kind: Gateway
    metadata:
      name: test
    spec:
      listeners:
        - name: test
          port: 6666
          protocol: Dubbo

  - kind: DubboRoute
    spec:
      parentRefs:
        - kind: Gateway
          name: test
          sectionName: test
      rules:
        - matches:
            - type: Exact
              service: org.apache.dubbo.sample.UserProvider
              version: v1
              method: getUser
          backendRefs:
            - kind: Backend
              name: httpbin-service-v1

  - kind: Backend
    metadata:
      name: httpbin-service-v1
    spec:
      targets:
        - address: 127.0.0.1
          port: 20880
